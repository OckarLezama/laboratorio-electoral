<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio Político · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Generado por pipeline/sitio.py desde src/inicio.html. Editar allá. */
/* v11. Encabezado compacto con la línea del proceso, tarjetas que siguen a la zona elegida, zoom en el mapa y transiciones que interpolan en lugar de redibujar. v10: un solo tablero en dos niveles: México (32 estados) y el estado elegido. Se entra al detalle desde el mapa, la lista o el buscador; todo el tablero sigue a la zona elegida. Gris del riel de la plataforma como ancla; turquesa para datos que no son de partido; colores de partido de la plataforma. */
:root{
  --bg:#F4F6F6;--card:#FFFFFF;--line:#E3E9E8;--hair:#EEF2F2;--ink:#4E5656;--strong:#1C2121;--muted:#86908F;
  --teal:#1C7F79;--teal2:#4CC1BA;--tealxl:#E4F5F3;--coral:#F46883;--peach:#F5A47C;--rail:#1F2222;--sea:#DCEBEA;--land:#EEF4F3;
  --sh:0 1px 2px rgba(20,40,40,.04),0 6px 20px rgba(20,40,40,.07);
  --f:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--d:'Manrope','Inter',ui-sans-serif,system-ui,sans-serif;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:12px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.n{font-family:var(--d);font-variant-numeric:tabular-nums}
.app{width:1440px;height:860px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:12px 16px;transform-origin:0 0}
.fade{transition:opacity .4s ease}.fade.out{opacity:0}
/* encabezado */
.top{display:flex;align-items:center;gap:14px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8BE7E1,var(--teal2) 45%,#13615C);flex:none;box-shadow:0 2px 8px rgba(19,97,92,.35)}
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.crumb button{border:0;background:none;padding:0;color:var(--teal);font-weight:600;cursor:pointer;font-size:11px}
.crumb button:disabled{color:var(--muted);cursor:default;font-weight:500}
.cb{position:relative}
.cb input{border:0;background:transparent;font:800 26px/1.05 var(--d);color:var(--strong);padding:0 26px 0 0;width:300px;min-width:5ch;transition:width .3s;cursor:pointer;border-radius:6px}
.cb input:focus{width:300px!important;outline:none;background:var(--card);box-shadow:0 0 0 2px var(--teal2);cursor:text;padding-left:6px}
.cb svg{position:absolute;right:6px;top:50%;width:14px;height:14px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.ac{position:absolute;left:0;top:calc(100% + 6px);width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(16,40,40,.16);z-index:40;max-height:420px;overflow:auto;padding:6px}
.ac small{display:block;padding:6px 10px 3px;font-size:10.5px;color:var(--muted)}
.ac button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--strong);cursor:pointer}
.ac button em{font-style:normal;font-size:11px;color:var(--muted)}
.ac button[aria-selected="true"],.ac button:hover{background:var(--hair)}
.ac mark{background:#D8EFEC;color:inherit;border-radius:3px}
.fl{display:flex;flex-direction:column;gap:1px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 12px;min-width:190px;box-shadow:var(--sh)}
.fl small{font-size:10px;color:var(--muted)}.fl select{border:0;background:transparent;font-weight:600;color:var(--strong);padding:0;font-size:12.5px;cursor:pointer}
.cd{margin-left:auto;text-align:right;line-height:1.1}.cd b{font:800 24px var(--d);color:var(--strong)}.cd span{display:block;font-size:10.5px;color:var(--muted)}
/* ficha oscura */
.fi{display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr .95fr;background:var(--rail);border-radius:16px;padding:13px 0;box-shadow:var(--sh)}
.c{padding:0 18px;border-left:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:3px;min-width:0}
.c:first-child{border-left:0}
.c small{font-size:11px;color:#93A09F}
.c b{font:800 23px/1.1 var(--d);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c b em{font:600 12.5px var(--f);color:#B9C4C3;font-style:normal}
.c span{font-size:11px;color:#93A09F}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:2px}
.sb{display:flex;height:6px;border-radius:4px;overflow:hidden;gap:2px;margin:3px 0 1px}.sb i{display:block;transition:flex .5s ease}
/* cuerpo */
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.88fr) minmax(0,1.36fr);gap:10px;min-height:0}
.col{display:grid;gap:10px;min-height:0}
.col2{grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
.col3{grid-template-rows:minmax(0,1.5fr) minmax(0,1fr)}
.p{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;box-shadow:var(--sh)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph>div{min-width:0}
.ph h2{margin:0;font:700 13.5px var(--d);color:var(--strong);white-space:nowrap}
.ph p{margin:1px 0 0;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{font-size:10px;color:var(--muted)}
.amp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--teal);cursor:pointer;flex:none}
.amp svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6}
.amp:hover{background:var(--hair)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px}.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px}.lg b{color:var(--strong);font-family:var(--d)}
.lg .ramp{width:90px;height:8px;border-radius:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--hair);border-radius:9px;padding:2px;gap:2px}
.seg button{white-space:nowrap;border:0;background:none;border-radius:7px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--strong);box-shadow:0 1px 2px rgba(20,40,40,.12)}
/* mapa */
.mp{padding:0;overflow:hidden;gap:0}
.mp .ph{padding:14px 16px 8px}
.lrow{padding:0 16px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mp .lg{padding:0 16px 8px;min-height:24px}
.mapw{flex:1 1 0;min-height:0;position:relative;background:var(--sea)}
.mapw>svg{position:absolute;inset:0;width:100%;height:100%}
.lvl{transition:opacity .45s ease}
.ctx path{fill:var(--land);stroke:#C9D9D7;stroke-width:.8;vector-effect:non-scaling-stroke}
.ctx path.c3{fill:#F8FBFA;stroke:#AFC4C2;cursor:pointer}.ctx path.c3:hover{fill:var(--tealxl)}
.lab text{font-weight:600;font-family:var(--f);fill:#8FA3A1;pointer-events:none}
#gun,#gst{filter:drop-shadow(0 2px 6px rgba(16,40,40,.16))}
path.u,path.st{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .4s ease,fill .5s ease,fill-opacity .5s ease}
path.u:hover,path.st:hover{filter:brightness(1.08)}
.foc path.u,.foc path.st{opacity:.32}.foc path.u.on,.foc path.st.on{opacity:1;stroke:var(--strong);stroke-width:2.4}
path.st.dim{opacity:.16}
path.ent{fill:none;stroke:#5E6E6D;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}
.stl text{font-weight:700;font-family:var(--f);fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.22);stroke-width:2px;transition:opacity .3s}
.mctl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.mctl button,.chipb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--strong);cursor:pointer;box-shadow:0 1px 2px rgba(20,40,40,.06)}
.mctl button[aria-pressed="true"]{background:var(--strong);color:#fff;border-color:var(--strong)}
.mp .foot{padding:8px 16px 12px}
.s2{position:relative;flex:0 1 220px}
.s2 input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:6px 10px 6px 30px;font-size:12px}
.s2 svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2}
.s2 .ac{left:auto;right:0;width:300px}
.focus{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--strong);background:#fff;border-radius:10px;padding:5px 6px 5px 10px;box-shadow:0 4px 14px rgba(16,40,40,.14);transition:opacity .3s,transform .3s}
.focus.off{opacity:0;transform:translateY(-6px);pointer-events:none}
.focus button{border:0;background:var(--tealxl);border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;color:var(--teal)}
.csel{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600}.csel select{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px 6px;font-size:11px;font-weight:600;color:var(--strong)}
/* tarjeta de estado (nivel México) */
.prev{position:absolute;left:12px;top:12px;width:280px;background:var(--card);border-radius:14px;box-shadow:0 14px 36px rgba(16,40,40,.2);padding:12px 14px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none}
.prev.in{opacity:1;transform:none;pointer-events:auto}
.prev h3{margin:0;font:800 17px var(--d);color:var(--strong)}.prev small{font-size:10.5px;color:var(--muted)}
.prev dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:11px}.prev dt{color:var(--muted)}.prev dd{margin:0;color:var(--strong);font-weight:600}
.go{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--rail);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:12.5px;cursor:pointer;transition:background .2s}
.go:hover{background:#2E3535}.go svg{width:14px;height:14px;stroke:#8BE7E1;fill:none;stroke-width:2}
.go[disabled]{background:var(--hair);color:var(--muted);cursor:default}
.px{position:absolute;right:8px;top:8px;border:0;background:var(--hair);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--strong)}
/* resultados */
.hero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero i{width:10px;height:10px;border-radius:50%;align-self:center}
.hero b{font:800 30px/1 var(--d);letter-spacing:-.01em}
.hero span{font:700 13px var(--d);color:var(--strong)}
.hero em{margin-left:auto;font-style:normal;font-size:11px;background:var(--hair);border-radius:20px;padding:2px 9px;color:var(--ink);font-weight:600}
.bw{flex:1 1 0;min-height:0;position:relative}
.bw svg,.cw svg,.agw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.note{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);align-items:center}
.note i{display:inline-block;width:9px;height:9px;border-radius:2px;background:linear-gradient(#CF4B42 0 35%,#A9455E 35%);margin-right:5px;vertical-align:-1px}
.note s{display:inline-block;width:14px;border-top:2px dashed #3A4A49;margin-right:5px;vertical-align:3px;text-decoration:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gr{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.dr{stroke-dasharray:var(--len);animation:draw 1s cubic-bezier(.3,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.pp{transform-box:fill-box;transform-origin:center;animation:pop .45s ease both}
/* lista */
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rank{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;scrollbar-width:thin;scroll-behavior:smooth}
.r{display:grid;grid-template-columns:20px minmax(0,1fr) 52px;gap:2px 8px;align-items:center;font-size:11.5px;cursor:pointer;padding:5px 6px;border-radius:9px;transition:background .25s}
.r:hover{background:var(--hair)}
.r .k{font:700 10px var(--d);color:var(--muted);text-align:right}
.r span{color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r b{text-align:right;font:700 12px var(--d);color:var(--strong)}
.r .sh{grid-column:2/4;display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--hair);gap:1px}
.r .sh i{display:block;height:100%;transition:width .5s ease}
.r .tq{grid-column:2/4;height:6px;border-radius:3px;background:var(--hair);position:relative}
.r .tq i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--teal)}
.r .tq s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--strong);border-radius:1px}
.r.on{background:var(--rail);box-shadow:0 4px 14px rgba(16,40,40,.18)}
.r.on span,.r.on b{color:#fff}.r.on .k{color:#8BE7E1}.r.on .sh,.r.on .tq{background:rgba(255,255,255,.14)}
.r .go2{display:none}
.more{border:0;background:none;color:var(--teal);font-weight:600;font-size:11.5px;padding:0;cursor:pointer;text-align:left}
/* evolución */
.tb{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pt{display:flex;flex-wrap:wrap;gap:4px}
.pt button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}
.pt button i{width:7px;height:7px;border-radius:50%;background:var(--pc);opacity:.35}
.pt button[aria-pressed="true"]{color:var(--strong);border-color:var(--pc)}.pt button.hl{background:var(--pc);color:#fff}.pt button.hl i{background:#fff}.pt button[aria-pressed="true"] i{opacity:1}
.cw{flex:1 1 0;min-height:0;position:relative}
.cw text{font:500 10px var(--f);fill:var(--muted)}
.cw .yl{font:700 11px var(--d);fill:var(--strong)}
.cw .yl.no{font-weight:500;fill:#B5BFBE}
.small{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-height:0}
.small .p{gap:8px;padding:12px 14px}
.agw{flex:1 1 0;min-height:0;position:relative}
.agw text{font-family:var(--f)}
/* competencia */
.wg{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;grid-auto-rows:9px;align-content:start;flex:none}
.wg i{display:block;border-radius:2px;animation:pop .4s ease both}
.wg.wgb{gap:3px;grid-auto-rows:17px}
.wl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wl div{display:flex;flex-direction:column;gap:1px;min-width:0}
.wl span{display:flex;align-items:center;gap:5px;font-size:11px}.wl span b{color:var(--strong)}.wl span i{width:8px;height:8px;border-radius:2px}
.wl strong{font:800 17px/1.1 var(--d);color:var(--strong)}
.wl em{font-style:normal;font-size:9.5px;color:var(--muted);line-height:1.2}
.wf2{font-size:10px;color:var(--muted);border-top:1px solid var(--hair);padding-top:7px}.wf2 b{color:var(--strong)}
.sb2{display:flex;height:8px;border-radius:5px;overflow:hidden;gap:2px}.sb2 i{display:block}
.wl2{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px}.wl2 span{display:inline-flex;align-items:center;gap:5px}.wl2 i{width:8px;height:8px;border-radius:2px}.wl2 b{color:var(--strong)}
.cpf{flex:1 1 0;display:flex;flex-direction:column;gap:9px;min-height:0}
/* en juego 2027 */
.jg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.jg div{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--kc);padding-left:9px}
.jg b{font:800 24px/1.05 var(--d);color:var(--strong)}.jg span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;overflow:auto;min-height:0}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:600;color:var(--strong);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.chips button i{width:7px;height:7px;border-radius:50%}
.chips button:hover{border-color:var(--rail)}.chips button.on{background:var(--rail);color:#fff;border-color:var(--rail)}
/* ventanas ampliadas */
.mod{position:fixed;inset:0;background:rgba(22,33,33,.38);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;opacity:0;transition:opacity .3s}
.mod.in{opacity:1}
.mb{background:var(--card);border-radius:20px;width:min(1180px,100%);max-height:100%;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px;transform:translateY(12px) scale(.985);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mod.in .mb{transform:none}
.mh{display:flex;align-items:flex-start;gap:12px}.mh h2{margin:0;font:800 22px var(--d);color:var(--strong)}.mh p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.x{margin-left:auto;border:0;background:var(--hair);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--strong);flex:none}
.kt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kt div{border:1px solid var(--line);border-radius:12px;padding:10px 14px;border-left:3px solid var(--kc,var(--line))}
.kt small{font-size:10.5px;color:var(--muted)}.kt b{display:block;font:800 22px/1.15 var(--d);color:var(--strong)}.kt span{font-size:11px;color:var(--muted)}
.mg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.mbox{background:#F3F6F6;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0;font:700 12.5px var(--d);color:var(--strong)}.mbox p{margin:0;font-size:12px;color:var(--ink)}
.bigc{position:relative;height:380px}.bigc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bigc text{font-family:var(--f)}
.bigt text{font:500 11px var(--f);fill:var(--muted)}.bigt .yl{font:700 12px var(--d);fill:var(--strong)}.bigt .yl.no{font-weight:500;fill:#B5BFBE}
.tip{position:fixed;pointer-events:none;background:var(--strong);color:#fff;font-size:11.5px;border-radius:8px;padding:6px 9px;z-index:90;max-width:270px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pantallas chicas: se apila */
body.mob{overflow:auto;height:auto}body.mob .app{width:auto;height:auto;transform:none;grid-template-rows:none}
body.mob .top{flex-wrap:wrap}body.mob .cd{margin-left:0;text-align:left;flex-basis:100%;display:flex;gap:8px;align-items:baseline}
body.mob .cb input{width:220px}
body.mob .fi{grid-template-columns:1fr 1fr;row-gap:12px}body.mob .fi .c{border-left:0}body.mob .fi .c:first-child{grid-column:1/-1}
body.mob .grid,body.mob .small{grid-template-columns:1fr}body.mob .col2,body.mob .col3{grid-template-rows:none}
body.mob .mapw{height:340px;flex:none}body.mob .cw,body.mob .bw,body.mob .agw{height:260px;flex:none}body.mob .rank{flex:none;max-height:420px}
body.mob .prev{width:auto;right:12px}body.mob .jg{grid-template-columns:1fr 1fr}body.mob .kt{grid-template-columns:1fr 1fr}body.mob .mg{grid-template-columns:1fr}
body.mob .mod{padding:0}body.mob .mb{border-radius:0;height:100%}

/* calendario */

.app{position:relative}

let LV='mx',M=NM,ek=NM.order.filter(k=>k.startsWith('PRE_')).pop(),unit='e0',lay='m',mmode='w',circ=0,rk='m',showAll=false,trShow=null,resMode='c',busy=false;

/* ===== resultados de una zona en una elección ===== */
function R(u,k){const e=M.EL[k];if(!e)return null;if(e.comp&&LV==='mx'&&isRoot(u))return Rcnt(u,k);const x=e.v[u];if(!x)return null;const [t,ln,v]=x;let val=0;for(const p in v)val+=v[p];if(!val)return null;

  const bl=BL.map(([l,ms])=>{const parts=ms.map(p=>({p,v:v[p]||0})).filter(q=>q.v>0).sort((a,b)=>(b.p===l)-(a.p===l)||b.v-a.v);return {l,ms,parts,v:parts.reduce((a,q)=>a+q.v,0)};}).filter(b=>b.v>0).sort((a,b)=>b.v-a.v);
  if(!bl.length)return null;
  bl.forEach(b=>{b.p=100*b.v/val;b.parts.forEach(q=>q.pc=100*q.v/val);b.n=b.parts.slice(0,3).map(q=>pn(q.p)).join('-')+(b.parts.length>3?' y '+(b.parts.length-3)+' más':'');b.s=pn(b.parts[0]?b.parts[0].p:b.l)+(b.parts.length>1?'+':'');});
  const per={};for(const p in v)if(p!=='OTROS')per[p]=100*v[p]/val;
  return {t,ln,val,v,bl,per,turn:ln?100*t/ln:null,m:bl[0].p-(bl[1]?bl[1].p:0),nul:Math.max(0,t-val)};}
function Rcnt(u,k){const us=u==='e0'?NAC.est.map(e=>'e'+e.ent):CIRCS[u.slice(1)];const c={};let n=0,t=0,ln=0;us.forEach(x=>{const r=R(x,k);if(!r)return;n++;t+=r.t;ln+=r.ln;const p=r.bl[0].parts[0].p;c[p]=(c[p]||0)+1;});if(!n)return null;
  const bl=Object.keys(c).map(p=>({l:p,ms:[p],v:c[p],p:100*c[p]/n,parts:[{p,v:c[p],pc:100*c[p]/n}],n:pn(p),s:pn(p)})).sort((a,b)=>b.v-a.v),per={};bl.forEach(b=>per[b.l]=b.p);
  return {cnt:1,n,t,ln,val:n,v:c,bl,per,turn:ln?100*t/ln:null,m:bl[0].p-(bl[1]?bl[1].p:0),nul:0};}

/* ===== mapa: viewBox animado en escala logarítmica ===== */
const svg=$('map');let vb=[0,0,1000,700],raf=0;
const setVB=v=>{vb=v;svg.setAttribute('viewBox',v.map(x=>x.toFixed(2)).join(' '));$('gstl').style.fontSize=(v[2]*.017).toFixed(2)+'px';};
function fitBox(b,pad){const p=Math.max(b[2],b[3])*pad,W=svg.clientWidth||600,H=svg.clientHeight||500;let w=b[2]+2*p,h=b[3]+2*p;if(w/h<W/H)w=h*W/H;else h=w*H/W;return [b[0]+b[2]/2-w/2,b[1]+b[3]/2-h/2,w,h];}
const ease=x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2;
function animVB(t,dur=1200){return new Promise(res=>{wzT=null;cancelAnimationFrame(raf);if(RM){setVB(t);res();return;}const s=vb.slice(),c0=[s[0]+s[2]/2,s[1]+s[3]/2],c1=[t[0]+t[2]/2,t[1]+t[3]/2],t0=performance.now();
  const step=now=>{const u=Math.min(1,(now-t0)/dur),k=ease(u),w=Math.exp(Math.log(s[2])+(Math.log(t[2])-Math.log(s[2]))*k),h=w*t[3]/t[2],cx=c0[0]+(c1[0]-c0[0])*k,cy=c0[1]+(c1[1]-c0[1])*k;setVB([cx-w/2,cy-h/2,w,h]);if(u<1)raf=requestAnimationFrame(step);else{setVB(t);res();}};raf=requestAnimationFrame(step);});}
const bbOf=el=>{const b=el.getBBox();return [b.x,b.y,b.width,b.height];};
/* zoom con la rueda, botones o arrastre; el clic sigue eligiendo zona */
let drag=null,moved=false,wzT=null;
const zLim=w=>{const B=LV==='mx'?MX32.w:(stBox?Math.max(stBox[2],stBox[3]):1000);return Math.max(B*.012,Math.min(w,B*1.8));};
function zoomTo(k,px,py,ms){const b=wzT||vb,w=zLim(b[2]*k),f=w/b[2],h=b[3]*f,t=[b[0]+(b[2]-w)*px,b[1]+(b[3]-h)*py,w,h];

svg.addEventListener('wheel',e=>{e.preventDefault();th();const r=svg.getBoundingClientRect();zoomTo(Math.exp(Math.max(-.35,Math.min(.35,e.deltaY*(e.deltaMode?.04:.0016)))),(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);},{passive:false});

async function drawZones(){const t=zEff(),my=++zReq,g=$('gzn');

  void g.getBoundingClientRect();g.style.transition='';requestAnimationFrame(()=>{g.style.opacity=1;$('mlg').classList.remove('out');});return true;}

    else if(mmode==='g'){if(e&&e.gob){k=e.gob.l;f=pc(k);}}

  $('dgs').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.s===dgS);b.onclick=()=>{dgS=b.dataset.s;desglose();};});

  if(LV==='mx'&&(dgL==='f'||dgL==='m')&&!ZN.geo[dgL]){$('dgt').innerHTML='<div class="foot" style="grid-column:1/-1">Cargando…</div>';Promise.all([zonasData(),zonasGeo(dgL)]).then(()=>{if($('dgt'))desglose();});return;}
  const q=norm($('dgq').value.trim()),us=LV==='mx'?(dgL==='c'?Object.keys(CIRCS).filter(c=>!circ||+c===circ).map(c=>'c'+c):dgL==='e'?NAC.est.filter(e=>!circ||e.circ===circ).map(e=>'e'+e.ent):ZN.geo[dgL].map(x=>dgL+x.id).filter(u=>!circ||ES['e'+entOf(u)].circ===circ)):M.geo[dgL].map(x=>dgL+x.id);
  let L=us.map(u=>{const r=R(u,ek);return r?{u,n:uname(u),r}:null}).filter(Boolean);const all=L.length;L=L.filter(x=>!q||norm(x.n).includes(q));
  L.sort(dgS==='m'?(a,b)=>a.r.m-b.r.m:dgS==='w'?(a,b)=>b.r.ln-a.r.ln:(a,b)=>a.n.localeCompare(b.n,'es',{numeric:true}));
  $('dgn').textContent=`${fmt(L.length)} ${L.length===1?'fila':'filas'}${q?` de ${fmt(all)}`:''}${L.length>250?'; se muestran 250, usa el buscador para encontrar el resto':''}. Ventaja: puntos entre el 1º y el 2º lugar (rojo: menos de 5; naranja: 5 a 15; verde: más de 15).`;
  const pill=m=>m<5?['#FDE3E8','#B3344F']:m<15?['#FDEBDF','#A55A2E']:['#E2F3F0','#1C7F79'];
  $('dgt').innerHTML=`<div class="hd"><span></span><span>${DGN[dgL]}</span><span>Reparto del voto</span><span>Ganador</span><span>Ventaja</span><span style="text-align:right">Electores</span></div>`+L.slice(0,250).map((x,i)=>{const w=x.r.bl[0],s=x.r.bl[1],pp=pill(x.r.m);
    return `<div class="rw" data-u="${x.u}"><span>${i+1}</span><span><b style="color:var(--strong)">${x.n}</b></span><span><span class="bar">${x.r.bl.map(b=>`<i style="flex:${b.p.toFixed(2)};background:${pc(b.parts[0].p)}" title="${b.n} ${f1(b.p)}%"></i>`).join('')}</span></span><span><i class="sw" style="background:${pc(w.parts[0].p)}"></i>${w.s}</span><span><span class="pill" style="background:${pp[0]};color:${pp[1]}">${f1(x.r.m)} pts<small>${s?fmt(w.v-s.v)+(Math.round(w.v-s.v)===1?' voto':' votos'):''}</small></span></span><span class="num">${fmt(x.r.ln)}</span></div>`;}).join('');
  $('dgt').querySelectorAll('.rw').forEach(r=>r.onclick=()=>{const u=r.dataset.u;closeMod();if(LV==='mx'){if(u[0]==='c'){circ=+u.slice(1);controls();ficha();setUnit(root());return;}if(u[0]!=='e'&&zl!==u[0]){zl=u[0];zlAuto=false;}else if(u[0]==='e'&&zl!=='e'&&mmode!=='g'&&mmode!=='27'){zl='e';zlAuto=false;}setUnit(u);return;}if(lay!==u[0]){lay=u[0];drawLayer();controls();}setUnit(u);});}
function bigTrend(again){const o=trData(),n=o.D.length;
  if(!$('mtr'))openMod(`<div class="mh"><div><h2>Evolución del voto</h2><p id="mts"></p></div><button class="playb" id="bpl"><i>▶</i><span>Reproducir elección por elección</span></button><button class="x" aria-label="Cerrar">✕</button></div><div class="tb"><div class="seg" id="mty"></div><div class="seg" id="mab"><button data-a="0">% de votación</button><button data-a="1">Votos</button></div></div><div class="tb"><div class="pt" id="mpt"></div></div><div class="ktiles" id="mtk"></div><div class="bigc bigt" style="height:min(400px,46vh)"><svg id="mtsvg"></svg></div><p class="foot">Clic en un partido para mostrarlo u ocultarlo; doble clic para destacarlo. Pasa el cursor por un punto para ver el detalle. Años en gris: no hubo esa elección. Votos de coalición repartidos en partes iguales.</p>`,'mtr');
  trControls($('mty'),$('mpt'),o,()=>tendencia(),9);if(o.mixed||!n){$('mtk').innerHTML='';$('mpt').innerHTML='';$('mts').textContent=uname(unit);setTimeout(()=>{if($('mtsvg'))trMsg($('mtsvg'),o.mixed?'Cada estado elige gubernatura en un año distinto.':'Sin resultados de este cargo para esta zona.',o.mixed?'Elige un estado para ver su evolución.':'Elige otra zona u otro cargo.');},$('mod').classList.contains('xp')?470:40);return;}$('mts').textContent=n?`${TYS[trT]}, ${o.D[0].y}–${o.D[n-1].y} · ${uname(unit)} · ${trAbs?'votos':'% de la votación válida'}, votación propia de cada partido`:'';
  $('mab').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',(+b.dataset.a===1)===trAbs);b.onclick=()=>{trAbs=b.dataset.a==='1';bigTrend(true);};});
  $('mtk').innerHTML=tiles(o);$('mtk').querySelectorAll('.wseq i').forEach(el=>{const x=o.D[+el.dataset.j],b=x.r.bl[0],s2=x.r.bl[1];el.onmousemove=e=>tt(e,`<b>${TYN[trT]} ${x.y}</b><br>Ganó ${b.n} con ${f1(b.p)}%`+(s2?`<br>2º ${s2.n} ${f1(s2.p)}% (ventaja ${f1(b.p-s2.p)} pts)`:'')+(+el.dataset.j>0&&o.D[+el.dataset.j-1].r.bl[0].parts[0].p!==b.parts[0].p?'<br><b>Cambio de partido ganador</b>':''));el.onmouseleave=th;});$('bpl').onclick=playTrend;
  setTimeout(()=>{if($('mtsvg'))trSVG($('mtsvg'),{...o,big:1,abs:trAbs});},again===true?0:($('mod').classList.contains('xp')?470:40));}
function playTrend(){const s=$('mtsvg'),r=$('tcrb');if(!r||playing)return;playing=1;const W=+r.getAttribute('width'),t0=performance.now(),dur=900*Math.max(2,trData().D.length);
  s.querySelectorAll('.ends').forEach(e=>e.style.visibility='hidden');$('bpl').classList.add('on');$('bpl').querySelector('span').textContent='Reproduciendo…';
  const st=now=>{const u=Math.min(1,(now-t0)/dur);r.setAttribute('width',(W*u).toFixed(1));if(u<1&&$('mtr'))requestAnimationFrame(st);else{playing=0;s.querySelectorAll('.ends').forEach(e=>e.style.visibility='');if($('bpl')){$('bpl').classList.remove('on');$('bpl').querySelector('span').textContent='Reproducir elección por elección';}}};r.setAttribute('width',0);requestAnimationFrame(st);}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{srcCard=b.closest('.p');b.dataset.open==='res'?bigRes():bigTrend();});

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function mkAC(inp,box,src,go,keep){let I=-1,Lx=[];const mark=()=>box.querySelectorAll('button[data-i]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i===I));
  const render=()=>{const raw=inp.value.trim(),q=inp.dataset.typed?norm(raw):'';const r=src(q);Lx=r.items;I=Lx.findIndex(x=>x.ok!==false);
    const hl=t=>{const i=norm(t).indexOf(q);return !q||i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length);};
    box.innerHTML=r.groups.map(([g,its])=>its.length?`<small>${g}</small>`+its.map(x=>`<button role="option" data-i="${Lx.indexOf(x)}"><span>${hl(x.n)}</span><em>${x.em||''}</em></button>`).join(''):'').join('')+(Lx.length?'':'<small>Sin coincidencias. Prueba con otra parte del nombre.</small>');
    box.hidden=false;inp.setAttribute('aria-expanded','true');box.querySelectorAll('button[data-i]').forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(+b.dataset.i);});mark();};
  const pick=i=>{const x=Lx[i];if(!x)return;box.hidden=true;inp.blur();go(x);};
  inp.oninput=()=>{inp.dataset.typed=1;render();};inp.onfocus=()=>{delete inp.dataset.typed;if(!keep)inp.value='';else inp.select();render();};
  inp.onblur=()=>setTimeout(()=>{box.hidden=true;inp.setAttribute('aria-expanded','false');if(keep)crumb();else inp.value='';},140);
  inp.onkeydown=e=>{if(box.hidden)return;if(!Lx.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();I=(I+(e.key==='ArrowDown'?1:-1)+Lx.length)%Lx.length;mark();}else if(e.key==='Enter'){e.preventDefault();pick(I);}else if(e.key==='Escape'){box.hidden=true;inp.blur();}};}
mkAC($('q'),$('ac'),q=>{const st=NAC.est.filter(e=>!q||norm(e.n).includes(q)).map(e=>({c:e.clave,u:'e'+e.ent,n:e.n,em:AVAIL.has(e.clave)?'con detalle':'Circunscripción '+e.circ}));
  const mx=!q||'mexico'.includes(q)?[{mx:1,n:'México',em:'vista general'}]:[];return {items:mx.concat(st),groups:[['País',mx],['Estados',st]]};},
  x=>{if(x.mx){circ=0;if(LV==='st')toNation();else{controls();ficha();setUnit('e0');}return;}if(AVAIL.has(x.c)){if(LV==='st'){if(M.cab!==x.c)switchState(x.c);}else toState(x.c);}else{if(LV==='st')toNation().then(()=>setUnit(x.u));else setUnit(x.u);}},true);

mkAC($('q2'),$('ac2'),q=>{const t=lay==='e'?'m':lay,us=M.geo[t].map(x=>t+x.id).filter(u=>!q||norm(uname(u)).includes(q)).sort((a,b)=>q?norm(uname(a)).indexOf(q)-norm(uname(b)).indexOf(q):uname(a).localeCompare(uname(b),'es',{numeric:true})).slice(0,14).map(u=>({u,n:uname(u),em:R(u,ek)?'':'sin dato'}));
  return {items:us,groups:[[`${({m:'Municipios',d:'Distritos locales',f:'Distritos federales'})[t]} de ${M.est}`,us]]};},x=>{const t=x.u[0];if(lay!==t){lay=t;drawLayer();controls();}setUnit(x.u);});

  $('epop').innerHTML=(cp.length?`<div class="ey"><b>Hoy</b><div>${cp.map(k=>`<button data-k="${k}" class="${k===ek?'on':''}">${M.EL[k].lab}</button>`).join('')}</div></div>`:'')+ys.map(y=>`<div class="ey"><b>${y}</b><div>${O.filter(k=>M.EL[k].y===y).map(k=>`<button data-k="${k}" class="${k===ek?'on':''}">${TYN[k.split('_')[0]]}</button>`).join('')}</div></div>`).join('');

function cuenta(){const el=$('cdx'),now=new Date(),j=new Date('2027-06-07T00:00:00');if(now>j){el.hidden=true;return;}
  const a=new Date('2026-09-01T00:00:00'),P=d=>Math.max(0,Math.min(100,100*(d-a)/(j-a))),fd=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.',''),ev=CAL.filter(x=>x[0]).map(x=>({d:new Date(x[0]+'T12:00:00'),t:x[1].replace(/\s*\(.*?\)/,'')})).filter(e=>!/Jornada/.test(e.t)),nx=ev.find(e=>e.d>=now),dd=Math.ceil((new Date('2027-06-06T08:00:00')-now)/864e5);

   <div class="tlb"><span>${nx?`Próximo: <b class="nxd">${fd(nx.d)}</b> · ${nx.t}`:''}</span><span>Jornada electoral <b>6 jun 2027</b> · faltan <b>${dd}</b> días</span></div>`;
  el.querySelectorAll('[data-i]').forEach(c=>{const e=ev[+c.dataset.i];c.onmousemove=x=>tt(x,`<b>${e.d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})}</b><br>${e.t}`);c.onmouseleave=th;});
  el.querySelector('[data-h]').onmousemove=x=>tt(x,`<b>Hoy</b>, ${now.toLocaleDateString('es-MX',{day:'numeric',month:'long'})}`);el.querySelector('[data-h]').onmouseleave=th;
  el.querySelector('[data-j]').onmousemove=x=>tt(x,'<b>Jornada electoral</b><br>6 de junio de 2027, 8:00 a 18:00');el.querySelector('[data-j]').onmouseleave=th;
  el.title='Proceso electoral federal 2026-2027: de septiembre de 2026 a la jornada del 6 de junio de 2027. Línea turquesa: tiempo transcurrido.';}

{const h=location.hash.slice(1);if(AVAIL.has(h))setTimeout(()=>toState(h),500);}
